name: build

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Core tests
        run: dotnet test tests/SecureChat.Core.Tests/SecureChat.Core.Tests.csproj -c Release

      - name: Server tests
        run: dotnet test tests/SecureChat.Server.Tests/SecureChat.Server.Tests.csproj -c Release

  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build server
        run: dotnet build src/SecureChat.Server/SecureChat.Server.csproj -c Release

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install MAUI workload
        run: dotnet workload restore src/SecureChat.App/SecureChat.App.csproj

      - name: Build Windows app
        run: dotnet build src/SecureChat.App/SecureChat.App.csproj -f net9.0-windows10.0.19041.0 -c Release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: securechat-windows-x64
          path: src/SecureChat.App/bin/Release/net9.0-windows10.0.19041.0/win10-x64/
          retention-days: 14

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build Android APK
        run: dotnet build src/SecureChat.App/SecureChat.App.csproj -f net9.0-android -c Release

      # Без ключа подписи из secrets APK подписывается отладочным ключом —
      # такой файл годится для проверки, но не для обновления установленного
      # приложения.
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: securechat-android-apk
          path: src/SecureChat.App/bin/Release/net9.0-android/*.apk
          if-no-files-found: error
          retention-days: 14
